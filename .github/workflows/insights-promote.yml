name: ODIN Insights Controlled Promotion

on:
  workflow_dispatch:
    inputs:
      shadow_run_id:
        description: "GitHub Actions run ID containing the approved ODIN shadow artifact"
        required: true
        type: string
      approve:
        description: "Explicit human approval to promote this shadow artifact to production"
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

jobs:
  promote:
    if: ${{ inputs.approve == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download selected shadow artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/odin-shadow
          mkdir -p /tmp/odin-shadow
          gh run download "${{ inputs.shadow_run_id }}" \
            --repo "${{ github.repository }}" \
            --name odin-insights-v2-shadow \
            --dir /tmp/odin-shadow

      - name: Promote through ODIN gate
        env:
          ODIN_PROMOTE_APPROVED: "true"
          ODIN_REVIEWER: ${{ github.actor }}
          ODIN_SHADOW_RUN_ID: ${{ inputs.shadow_run_id }}
        run: |
          shadow_file="$(find /tmp/odin-shadow -name insights.v2.shadow.json -type f -print -quit)"
          report_file="$(find /tmp/odin-shadow -name generationReport.json -type f -print -quit)"
          test -n "$shadow_file"
          test -n "$report_file"
          # Proveniência reproduzível: copia as evidências do run para o repo
          # antes da promoção; o promote verifica o hash de cada arquivo.
          run_id="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1])).runId)' "$shadow_file")"
          evidence_src="$(find /tmp/odin-shadow -type d -path "*/evidence/${run_id}" -print -quit)"
          test -n "$evidence_src"
          mkdir -p "public/data/evidence/${run_id}"
          cp -R "${evidence_src}/." "public/data/evidence/${run_id}/"
          echo "ODIN_RUN_ID=${run_id}" >> "$GITHUB_ENV"
          # Correção editorial humana (opcional): manifesto versionado por runId,
          # revisado por PR. Aplica-se só ao artefato para o qual foi declarado
          # (runId + hash + valor original de cada campo); se for recusado, o
          # passo falha e nada é promovido. O artefato corrigido passa pelo
          # gate completo abaixo.
          manifest="editorial-corrections/${run_id}.json"
          if [ -f "$manifest" ]; then
            node scripts/apply-editorial-corrections.mjs "$shadow_file" "$manifest" /tmp/odin-shadow-corrected.json
            shadow_file=/tmp/odin-shadow-corrected.json
            echo "Correção editorial aplicada: ${manifest}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sem manifesto de correção editorial para ${run_id}." >> "$GITHUB_STEP_SUMMARY"
          fi
          node scripts/promote-insights.mjs \
            "$shadow_file" \
            public/data/insights.v2.json \
            "$report_file"

      - name: Verify promotion scope
        run: |
          set -euo pipefail
          # Permitido: o artefato de produção e as evidências do próprio run.
          unexpected="$(git status --porcelain --untracked-files=all | sed 's/^.. //' \
            | grep -v -x "public/data/insights.v2.json" \
            | grep -v "^public/data/evidence/${ODIN_RUN_ID}/" || true)"
          if [ -n "${unexpected}" ]; then
            echo "Unexpected files changed:"
            echo "${unexpected}"
            exit 1
          fi
          node scripts/verify-provenance.mjs public/data/insights.v2.json --require
          node scripts/review-summary.mjs public/data/insights.v2.json > /dev/null

      - name: Commit production insight artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/insights.v2.json "public/data/evidence/${ODIN_RUN_ID}"
          git commit -m "chore(odin): promote validated insights v2"
          git push origin HEAD:main
