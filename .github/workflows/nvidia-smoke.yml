name: ODIN NVIDIA Smoke Test

# MVP Readiness Gate: chamadas ao LLM (Nemotron) só por disparo manual.
# Nenhum smoke test automático em PR antes dos gates determinísticos.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: NVIDIA API contract smoke test
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: nvidia/nemotron-3.5-lightning-30b-a3b
        run: node scripts/nvidia-smoke.mjs
