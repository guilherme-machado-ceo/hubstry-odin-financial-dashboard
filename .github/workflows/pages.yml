name: ODIN GitHub Pages

# Monta o site (Vite) e publica a pasta dist no GitHub Pages.
# Antes, o Pages publicava a raiz do repositorio "como esta": o index.html de
# desenvolvimento aponta para /src/main.tsx, que o navegador nao executa,
# e a pagina ficava em branco. A Vercel nao muda (build proprio).
#
# Requer, uma vez: Settings > Pages > Source = "GitHub Actions".
#
# Gatilhos:
#   - push no main (codigo);
#   - fim dos workflows que gravam dados no main: os commits deles usam
#     [skip ci], que nao dispara "push", entao sem isto o Pages ficaria
#     com dados velhos;
#   - disparo manual.

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "ODIN Data Snapshot"
      - "ODIN Open Markets (dados abertos)"
      - "ODIN AIFS Forecast"
      - "ODIN Insights Controlled Promotion"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build para o endereco do Pages
        run: npm run build:github
      - name: Rotas do app (ex. /embed/:id) caem no index
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
