name: ODIN ENSO Signal (OISST)

# Sinal Nino 3.4 a partir do NOAA OISST v2.1 (AWS Open Data).
# Sinal diario de MONITORAMENTO; nao e ONI/RONI (indices oficiais NOAA/CPC).
#
# Gatilhos:
#   - schedule (main): 1x/dia, grava public/data/enso-oisst.json no repositorio.
#   - workflow_dispatch (main): idem, sob demanda.
#   - pull_request: testes + coleta real + gate + diagnostico; publica o JSON
#     apenas como artefato. NAO grava nada no repositorio.
# Se qualquer etapa obrigatoria falhar, nada e gravado: o main mantem o ultimo
# snapshot valido. O diagnostico contra a NOAA/CPC nunca bloqueia.
# A interface (que vai ler este JSON) e assunto de outro PR.

on:
  schedule:
    # Cron do GitHub e SEMPRE em UTC (Brasilia = UTC-3).
    # 09:17 UTC (06:17 BRT): o arquivo preliminar do dia anterior ja saiu
    # (~1 dia de atraso). Nao colide com 06:17 UTC (ODIN Data Snapshot),
    # 06:41 UTC seg (ODIN Open Markets), 08:23 e 20:23 UTC (ODIN AIFS Forecast).
    - cron: "17 9 * * *"
  pull_request:
    paths:
      - "scripts/oisst/**"
      - ".github/workflows/enso-oisst.yml"
  workflow_dispatch:

permissions:
  contents: read

# Nunca duas execucoes que gravam ao mesmo tempo (agendada x manual):
# a segunda espera a primeira terminar, nenhuma e cancelada.
concurrency:
  group: enso-oisst-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  enso:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/oisst/requirements.txt
      - name: Install (versoes exatas)
        run: pip install -r scripts/oisst/requirements.txt
      - name: Testes offline
        run: python3 -m unittest discover -s scripts/oisst -p "test_*.py" -v
      - name: Coleta real + gate (bucket publico, sem conta AWS)
        run: python3 scripts/oisst/fetch_oisst.py
      - name: Gate independente sobre o arquivo gerado
        run: python3 scripts/oisst/validate_enso.py public/data/enso-oisst.json
      - name: Diagnostico vs serie semanal NOAA/CPC (nao bloqueia)
        continue-on-error: true
        run: python3 scripts/oisst/diag_cpc.py public/data/enso-oisst.json
      - name: Publicar JSON para conferencia (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: enso-oisst
          path: public/data/enso-oisst.json
          retention-days: 7
      - name: Commit snapshot (agendado ou manual, somente no main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "odin-data-bot"
          git config user.email "odin-data-bot@users.noreply.github.com"
          git add public/data/enso-oisst.json
          if git diff --cached --quiet; then
            echo "Sem alteracoes no snapshot ENSO/OISST."
            exit 0
          fi
          git commit -m "chore(data): snapshot enso oisst [skip ci]"
          # Traz o que outro robo tenha gravado no main durante a execucao.
          # Se o rebase ou o push forem recusados, o passo falha e o main
          # remoto fica intacto (nada e sobrescrito; a proxima execucao repoe).
          git pull --rebase origin main
          git push origin HEAD:main
