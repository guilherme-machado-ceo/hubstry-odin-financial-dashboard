name: ODIN AIFS Forecast

# Previsao por IA do ECMWF (AIFS Single, dado aberto CC BY 4.0)
#   -> public/data/aifs-forecast.json
# Sem GPU e sem chave: o ECMWF roda o modelo; aqui so baixamos 4 campos e
# extraimos 8 cidades em CPU.
#
# Sprint AIFS-1 (sem agendamento ainda):
#   - pull_request: roda testes + previsao real + gate, publica o JSON como
#     artefato para conferencia. NAO grava nada no repositorio.
#   - workflow_dispatch (main): mesmo fluxo e grava o snapshot no repositorio.
# O site ainda NAO le este arquivo (troca de fonte na tela = PR seguinte).

on:
  pull_request:
    paths:
      - "scripts/forecast/**"
      - ".github/workflows/aifs-forecast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aifs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/forecast/requirements.txt
      - name: Install (ecmwf-opendata + eccodes, CPU)
        run: pip install -r scripts/forecast/requirements.txt
      - name: Testes offline
        run: python3 -m unittest discover -s scripts/forecast -p "test_*.py" -v
      - name: Previsao AIFS (download + extracao + gate)
        run: python3 scripts/forecast/fetch_aifs.py
      - name: Gate independente sobre o arquivo gravado
        run: python3 scripts/forecast/validate_forecast.py public/data/aifs-forecast.json
      - name: Publicar JSON para conferencia
        uses: actions/upload-artifact@v4
        with:
          name: aifs-forecast
          path: public/data/aifs-forecast.json
          retention-days: 7
      - name: Commit snapshot (somente disparo manual no main)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "odin-data-bot"
          git config user.email "odin-data-bot@users.noreply.github.com"
          git add public/data/aifs-forecast.json
          if git diff --cached --quiet; then
            echo "Sem alteracoes no snapshot AIFS."
            exit 0
          fi
          git commit -m "chore(data): snapshot ecmwf aifs [skip ci]"
          git push
