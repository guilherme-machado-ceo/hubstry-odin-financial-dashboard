name: ODIN AIFS Forecast

# Previsao por IA do ECMWF (AIFS Single, dado aberto CC BY 4.0)
#   -> public/data/aifs-forecast.json
# Sem GPU e sem chave: o ECMWF roda o modelo; aqui so baixamos 4 campos e
# extraimos 8 cidades em CPU.
#
# Gatilhos:
#   - schedule (main): 2x/dia, grava o snapshot no repositorio.
#   - workflow_dispatch (main): idem, sob demanda.
#   - pull_request: testes + previsao real + gate; publica o JSON como
#     artefato para conferencia. NAO grava nada no repositorio.
# Se qualquer etapa falhar, nada e gravado: o site mantem o ultimo snapshot
# valido e, apos 36 h, exibe o aviso de defasagem.

on:
  schedule:
    # Cron do GitHub e SEMPRE em UTC (Brasilia = UTC-3).
    # 08:23 UTC (05:23 BRT) -> ciclo AIFS 00Z ja publicado
    # 20:23 UTC (17:23 BRT) -> ciclo AIFS 12Z ja publicado
    # Minuto :23 evita a hora cheia (fila do GitHub) e nao colide com
    # 06:17 (ODIN Data Snapshot) nem 06:41 seg (ODIN Open Markets).
    - cron: "23 8 * * *"
    - cron: "23 20 * * *"
  pull_request:
    paths:
      - "scripts/forecast/**"
      - ".github/workflows/aifs-forecast.yml"
  workflow_dispatch:

permissions:
  contents: read

# Nunca duas execucoes que gravam ao mesmo tempo (agendada x manual):
# a segunda espera a primeira terminar, nenhuma e cancelada.
concurrency:
  group: aifs-forecast-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  aifs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/forecast/requirements.txt
      - name: Install (ecmwf-opendata + eccodes, CPU)
        run: pip install -r scripts/forecast/requirements.txt
      - name: Testes offline
        run: python3 -m unittest discover -s scripts/forecast -p "test_*.py" -v
      - name: Previsao AIFS (download + extracao + gate)
        run: python3 scripts/forecast/fetch_aifs.py
      - name: Gate independente sobre o arquivo gravado
        run: python3 scripts/forecast/validate_forecast.py public/data/aifs-forecast.json
      - name: Publicar JSON para conferencia
        uses: actions/upload-artifact@v4
        with:
          name: aifs-forecast
          path: public/data/aifs-forecast.json
          retention-days: 7
      - name: Commit snapshot (agendado ou manual, somente no main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "odin-data-bot"
          git config user.email "odin-data-bot@users.noreply.github.com"
          git add public/data/aifs-forecast.json
          if git diff --cached --quiet; then
            echo "Sem alteracoes no snapshot AIFS."
            exit 0
          fi
          git commit -m "chore(data): snapshot ecmwf aifs [skip ci]"
          # Traz o que outro robo tenha gravado no main durante a execucao.
          # Se o rebase ou o push forem recusados, o passo falha e o main
          # remoto fica intacto (nada e sobrescrito; a proxima execucao repoe).
          git pull --rebase origin main
          git push origin HEAD:main
