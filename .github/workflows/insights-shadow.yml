name: ODIN Insights Shadow

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate NVIDIA shadow artifact
        env:
          AI_PROVIDER: nvidia
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: nvidia/nemotron-3-super-120b-a12b
          AI_TIMEOUT_MS: 120000
        run: node scripts/generate-insights-shadow.mjs
      - name: Validate shadow artifact
        run: node scripts/validate-insights-shadow.mjs
      - name: Upload shadow artifact
        uses: actions/upload-artifact@v4
        with:
          name: odin-insights-v2-shadow
          path: public/data/insights.v2.shadow.json
          if-no-files-found: error
