name: ODIN Section Profile Fixtures

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate section profile fixtures
        run: node scripts/test-insights-profiles.mjs
      - name: Validate claim/evidence consistency (regressão df75)
        run: node scripts/test-evidence-consistency.mjs
      - name: Data & Intelligence Contract v1.1 (recomendação, lente, procedência, What to Watch PT/EN)
        run: node scripts/test-contract-v11.mjs
      - name: Verify published insights provenance
        run: node scripts/verify-provenance.mjs public/data/insights.v2.json
      - name: Review summary renders gate and claims
        run: node scripts/test-review-summary.mjs
      - name: Contract ↔ render (5 camadas no InsightBox)
        run: node scripts/test-contract-render.mjs
      - name: M1 layers (5 camadas, retry de contrato, snapshot)
        run: node scripts/test-m1-layers.mjs
      - name: Install dependencies (render test das camadas M2)
        run: npm ci --no-audit --no-fund
      - name: Section layers M2 (10 seções × 5 camadas, render PT/EN)
        run: node scripts/test-section-layers.mjs
      - name: Auditoria das fontes públicas (PR 2a)
        run: node scripts/test-data-audit.mjs
      - name: Briefing ODIN e vocabulário controlado (PR 2b)
        run: node scripts/test-briefing.mjs
      - name: Dados abertos, procedência em dois eixos e retiradas (PR 2c)
        run: node scripts/test-open-markets.mjs
